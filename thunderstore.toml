[config]
schemaVersion = "0.0.1"

# The version is not set here: package.sh passes it (from the git tag) with --package-version.
[package]
namespace = "BrugherheimFolks"
name = "Treecapitator"
description = "Adds the Treecapitator, a stone axe that fells any tree and breaks its stump in a single swing."
websiteUrl = "https://github.com/TonioGela/treecapitator"
containsNsfwContent = false

[package.dependencies]
ValheimModding-Jotunn = "2.30.2"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build/thunderstore"

# package.sh puts the built DLL here
[[build.copy]]
source = "./build/plugin"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "server-side"]
