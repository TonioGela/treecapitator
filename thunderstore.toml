[config]
schemaVersion = "0.0.1"

# The version is not set here: package.sh passes it (from the git tag) with --package-version.
[package]
namespace = "YourTeam"
name = "My_Mod"
description = "One sentence about what the mod does (max 250 characters)."
websiteUrl = "https://github.com/YOUR_USER/YOUR_REPO"
containsNsfwContent = false

[package.dependencies]
ValheimModding-Jotunn = "2.30.2"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build/thunderstore"

# package.sh puts the built DLL here
[[build.copy]]
source = "./build/plugin"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "server-side"]
